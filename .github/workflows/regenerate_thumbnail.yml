name: 🖼️ 썸네일 문구 재생성 (관리자 페이지 전용)

# ADMIN-THUMBNAIL-EDIT-1: stock-briefing-v3-1/docs/admin 관리자 페이지의
# "썸네일 수정" 탭이 이 워크플로우를 트리거한다. morning_core.yml이 남겨둔
# docs/thumbnails/latest_meta.json의 candidate(선정된 발언/종목 원본)를 그대로
# 재사용해 문구만 새로 입혀 다시 그린다 — OpenAI/TTS를 다시 부르지 않으므로
# 무료이고, 1~2분 안에 끝난다.
on:
  workflow_dispatch:
    inputs:
      which:
        description: "발언형(quote) 또는 뉴스형(news)"
        required: true
        type: choice
        options: [quote, news]
      title:
        description: "새 문구. 줄바꿈을 넣고 싶으면 그 자리에 \\n을 입력하세요"
        required: true
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -fv
          pip install requests Pillow>=10.0.0 pykrx matplotlib pandas mplfinance playwright imagehash pyyaml
          playwright install --with-deps chromium
      - name: 🖼️ 문구 반영해 재생성
        env:
          THUMB_WHICH: ${{ inputs.which }}
          THUMB_TITLE: ${{ inputs.title }}
        run: python pipeline/apply_thumbnail_edit.py "$THUMB_WHICH" --title "$THUMB_TITLE"
      - name: 📇 docs/thumbnails/ 커밋 & 푸시
        run: |
          if [ -n "$(git status --porcelain docs/thumbnails/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/thumbnails/
            git commit -m "admin: 썸네일 문구 수정 (${{ inputs.which }})"
            git pull --rebase
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
