# config/audio.yml
# 프리미엄 TTS 파이프라인(Phase H) 설정. pipeline/config_audio.py가 이 파일을
# 로드해 상수로 노출한다.

# 시도할 순서. is_configured()가 false인(API 키 없는) provider는 자동으로
# 건너뛴다. 이 레포는 아직 azure/elevenlabs 키가 없어 실제로는 항상 openai로
# 동작하지만, 키가 등록되면 그 즉시 우선순위대로 켜진다.
provider_priority: [azure, elevenlabs, openai]

providers:
  openai:
    voice: nova              # nova(여성) / onyx(남성) / alloy / echo / fable / shimmer
    model: tts-1-hd           # tts-1(빠름) / tts-1-hd(고품질)
    # 합성 단계에서 낭독 속도 자체를 조절한다(0.25~4.0, OpenAI TTS 네이티브
    # speed 파라미터). 다 만들어진 오디오를 나중에 ffmpeg atempo로 빨리 재생하는
    # 것과 달리 음높이 왜곡·기계음 느낌 없이 자연스럽게 빨라지고, 문장 사이
    # 포즈도 비례해서 짧아진다. 1.0이 원어민 기준 보통 속도.
    speaking_rate: 1.0

  azure:
    voice_id: ko-KR-SunHiNeural
    speaking_rate: 1.0       # 0.5~2.0, SSML prosody rate
    pitch: 0                  # -50~+50 (%)

  elevenlabs:
    # voice_id를 비워두면 voice_config.py의 get_voice_id()(환경변수
    # ELEVENLABS_VOICE_ID → 프리셋 → 기본값 순)를 그대로 사용한다.
    voice_id: ""
    model_id: eleven_multilingual_v2
    # FIX-VOICE-TOO-DEEP-1: 예전 값(stability 0.72 / style 미설정 → API
    # 호출에서 style/use_speaker_boost가 통째로 빠짐)이 사용자의 실제 학습
    # 목소리보다 굵고 느리고 개성 없는 "뉴스 앵커" 톤으로 나온다는 보고가
    # 있었다. stability를 낮춰 원본의 억양·에너지 변화를 더 살리고, style을
    # 올려 표현력(밝기/가벼움)을 더하고, use_speaker_boost를 명시적으로 켜서
    # 원본 목소리 유사도 보정이 실제로 적용되게 했다. 실제 음성은 이 세션
    # 환경에서 들어볼 수 없으니, 다음 실제 실행에서 사람이 직접 확인 후
    # 필요하면 이 값들을 더 조정해야 한다.
    stability: 0.45           # 0.0~1.0: 낮을수록 원본의 억양 변화가 더 살아남(기존 0.72 → 0.45)
    similarity_boost: 0.88
    style: 0.35                # 0.0~1.0: 표현력/에너지(기존 0.10 → 0.35, 더 밝고 가벼운 느낌)
    use_speaker_boost: true    # 원본 목소리 유사도 보정 — 예전엔 코드 버그로 API에 전달 안 됐음
    speaking_rate: 1.05        # voice_settings.speed (0.7~1.2 범위, 기존 1.0 → 1.05로 살짝 경쾌하게)
    output_format: mp3_44100_128

# TTS 합성 후 최종 영상 나레이션 속도를 맞추는 ffmpeg atempo 배속의 허용 범위.
# generate_video.py의 adjust_to_target_duration()이 이미 계산한 speed factor를
# 여기 범위로 한 번 더 clamp한다.
atempo:
  min_speed: 0.85
  max_speed: 1.15

# ffmpeg loudnorm 목표 음량(방송 표준 -16 LUFS 근방).
loudness:
  target_lufs: -16.0
  true_peak: -1.5
  loudness_range: 11.0

# BGM 사이드체인 덕킹(나레이션이 나올 때 BGM 볼륨을 자동으로 낮춤) + 구간별 볼륨.
bgm:
  intro_volume: 0.08
  body_volume: 0.045
  outro_volume: 0.08
  ducking_threshold_db: -25
  ducking_ratio: 8
