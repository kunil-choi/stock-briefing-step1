# config/pronunciation_ko.yml
# 종목명/영어 약어/숫자 표현의 TTS 발음 교정 사전. narration 텍스트에만
# 적용하고 subtitle(화면 자막)에는 절대 적용하지 않는다.
#
# 원래 pipeline/voice_config.py에 파이썬 리스트(PHONEME_RULES)로 하드코딩돼
# 있던 내용을 그대로 옮긴 것이다(개발자가 아니어도 이 파일만 고치면 발음이
# 바뀌도록 데이터 파일로 분리 — Phase H 요구사항). 순서가 중요하다(더 긴
# 패턴이 먼저 매치되어야 함) — 리스트 순서가 곧 치환 순서다.
#
# pipeline/config_audio.py의 apply_pronunciation_rules()가 이 파일을 순서대로
# 적용한다.

rules:
  # ── 영문 약어 → 한글 발음 ─────────────────────────────────────────────
  - ["SK하이닉스", "에스케이하이닉스"]
  - ["SK ", "에스케이 "]
  - ["LS증권", "엘에스증권"]
  - ["LS ", "엘에스 "]
  - ["LG에너지솔루션", "엘지에너지솔루션"]
  - ["LG화학", "엘지화학"]
  - ["LG전자", "엘지전자"]
  - ["LG ", "엘지 "]
  - ["KB금융", "케이비금융"]
  - ["KB ", "케이비 "]
  - ["IBK투자증권", "아이비케이투자증권"]
  - ["IBK ", "아이비케이 "]
  - ["HD현대중공업", "에이치디현대중공업"]
  - ["HD현대일렉트릭", "에이치디현대일렉트릭"]
  - ["HD현대", "에이치디현대"]
  - ["HBM", "에이치비엠"]
  - ["OTT", "오티티"]
  # "AI"는 한글로 풀어쓰지 않고 로마자 그대로 둔다 — TTS가 영어 발음으로
  # 자연스럽게 읽어주는데(사용자 피드백, 2026-08-13), "에이아이"로 강제
  # 치환하면 오히려 어색하게 들린다. CEO/SMR 같은 다른 영문 약어도 같은
  # 이유로 이 표에 등록하지 않고 로마자 그대로 둔다(_NARRATION_SUBTITLE_RULES
  # 프롬프트도 동일하게 안내).
  - ["ETF", "이티에프"]
  - ["ESS", "이에스에스"]
  - ["PCE", "피씨이"]
  - ["DSR", "디에스알"]
  - ["MOU", "엠오유"]
  - ["ADR", "에이디알"]
  - ["BPS", "비피에스"]
  - ["EPS", "이피에스"]
  - ["PER", "피이알"]
  - ["ROE", "알오이"]
  - ["POSCO", "포스코"]
  - ["KOSPI", "코스피"]
  - ["KOSDAQ", "코스닥"]
  - ["KrF", "케이알에프"]
  - ["ArF", "에이알에프"]
  - ["EUV", "이유브이"]
  - ["IPO", "아이피오"]
  - ["ISA", "아이에스에이"]
  - ["M&A", "엠앤에이"]
  - ["R&D", "알앤디"]
  - ["YoY", "와이오와이"]
  - ["QoQ", "큐오큐"]
  - ["BUY", "바이"]
  - ["Buy", "바이"]
  - ["MASH", "마쉬"]
  - ["CNS", "씨엔에스"]
  - ["RNAi", "알엔에이아이"]

  # ── 경음화 / 발음 교정 ───────────────────────────────────────────────
  # "주가 급등"을 "주까"+"급뜽"로 따로따로 치환하면(아래 개별 규칙) 낯선
  # 표기 두 개가 공백을 사이에 두고 나란히 남아 TTS가 "주 까 급 등"처럼
  # 음절 하나하나를 끊어 읽는다(사용자 피드백). 공백을 아예 없앤 한 덩어리로
  # 치환해 TTS가 한 단어처럼 자연스럽게 이어 읽게 한다 — 개별 규칙(주가→주까,
  # 급등→급뜽)보다 먼저 매치되도록 위에 둔다(더 긴 패턴 우선).
  - ["주가 급등", "주까급뜽"]
  - ["목표주가", "목표주까"]
  - ["목표가", "목표까"]
  - ["주가", "주까"]
  # "주까"+"에"를 그대로 붙여두면 TTS가 두 음절을 뭉개 "께"로 축약해 읽는다
  # (예: "주까에 반영" → "주께 바녕"으로 오독). 경음화(주까)는 그대로 살리되
  # "에" 조사 앞에 공백을 둬 음절이 뭉개지지 않게 한다 — "주가에"로 되돌리면
  # 경음화 자체가 없어져 버려(사용자 피드백: "주까에"로 읽혀야 함), 공백
  # 삽입으로 두 요구사항(경음화 유지 + "께" 오독 방지)을 동시에 만족시킨다.
  - ["주까에", "주까 에"]
  - ["유가", "유까"]
  - ["고유가", "고유까"]
  - ["저유가", "저유까"]
  - ["국채", "국째"]
  - ["역대", "역때"]
  - ["격차", "격짜"]
  - ["적자", "적짜"]
  - ["특징", "특찡"]
  - ["실적", "실쩍"]
  - ["실쩍보다", "실적보다"]  # 역방향 예외 방지
  - ["발전", "발쩐"]
  - ["결정", "결쩡"]
  - ["절감", "절깜"]
  - ["급등", "급뜽"]
  - ["신고가", "신고까"]
  - ["최고가", "최고까"]
  - ["최저가", "최저까"]
  - ["저가", "저까"]  # "최저가/저유가"보다 뒤에 둠(더 긴 패턴 우선 매치)
  - ["할 것", "할 껏"]
  - ["볼 수", "볼 쑤"]
  - ["될 것", "될 껏"]
  - ["있을", "이쓸"]

  # ── 숫자 표기 보조 ───────────────────────────────────────────────────
  # "삼성 전기"(공백)로 치환했더니 "삼성전이"로 들린다는 재발 피드백
  # (2026-08-13) — 공백 대신 "정기"로 바꿔 쓰면 TTS가 "전기"로 정확히
  # 읽는다(경험적 확인). 자막에는 영향 없음(narration 전용 규칙).
  - ["삼성전기", "삼성정기"]  # TTS 오독 방지 (자막에는 원래대로)
  # "단기"를 붙여 쓰면 TTS가 "기"를 삼켜 "단이"로 읽는다(사용자 피드백,
  # "단기 급등" 등에서 재현). "이권희"→"이궈 니"/"삼프로"→"삼 프로"와 동일한
  # 방식으로 음절 사이에 공백을 둬 TTS가 "기"를 독립된 음절로 읽게 한다.
  - ["단기", "단 기"]

  # ── 채널명/인명 고유 발음 ─────────────────────────────────────────────
  # "팔일오머니톡"처럼 붙여 쓰면 TTS가 한 단어처럼 뭉개 읽는다(사용자 피드백)
  # — "팔일오"와 "머니톡" 사이에 공백을 둬 자연스러운 끊어 읽기를 유도한다.
  # 소스에 "815머니톡"뿐 아니라 "8.15"/"8·15"(광복절 날짜 표기 스타일)로도
  # 들어올 수 있어(사용자 피드백) 점/가운뎃점 + 공백 유무 조합을 모두 잡는다
  # — 더 긴 패턴(공백 포함)이 먼저 와야 짧은 패턴에 앞서 매치된다.
  - ["8.15 머니톡", "팔일오 머니톡"]
  - ["8.15머니톡", "팔일오 머니톡"]
  - ["8·15 머니톡", "팔일오 머니톡"]
  - ["8·15머니톡", "팔일오 머니톡"]
  - ["815머니톡", "팔일오 머니톡"]
  # "이궈 니"(공백 삽입)로 바꿔도 "이꿘히"로 들린다는 재발 피드백
  # (2026-08-13, 2026-08-07 "이궈 니" 적용 이후 또 재발) — 공백을 없앤
  # "이궈니"로 바꾼다.
  - ["이권희", "이궈니"]
  # "삼프로"를 붙여 쓰면 TTS가 경음화해 "쌈프로"로 읽는다 → 공백을 넣어
  # "삼 프로"로 교정했었지만(사용자 피드백), "삼프로 TV"처럼 뒤에 "TV"가
  # 붙으면 공백 때문에 오히려 "썸 쁘로 티비"로 더 심하게 뭉개져 들린다는
  # 재발 피드백(2026-08-13). "삼프로"(단독)와 "삼프로 TV"(채널명 전체)를
  # 구분해서 처리한다: 아래 두 규칙은 위 "삼프로"→"삼 프로" 치환이 먼저
  # 적용된 뒤의 결과("삼 프로 TV"/"삼 프로TV")를 다시 붙여 쓴 한 단어
  # "삼프로티비"로 되돌린다 — TTS가 채널명을 한 단어로 자연스럽게 읽는다.
  - ["삼프로", "삼 프로"]
  - ["삼 프로 TV", "삼프로티비"]
  - ["삼 프로TV", "삼프로티비"]
